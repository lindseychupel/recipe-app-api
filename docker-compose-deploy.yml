version: "3.9"

services:
  app:
    build:
      context: .
    restart: always #p se travar o app ele reiniciar 
    volumes:
      - static_data:/vol/web # p servir dados estáticos 
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}            #config do serviço em execução
      - DB_PASS=${DB_PASS}
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
    depends_on:     
      - db          # pra garantir q o banco de dados inicie primeiro

  db:
    image: postgres:13-alpine
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}

  proxy:
    build:
      context: ./proxy
    restart: always
    depends_on:
      - app
    ports:
      - 80:8000
    volumes:
      - static_data:/vol/static

volumes:
  postgres-data:
  static_data: